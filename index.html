
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نینیم❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle, #52001e, #16000c 75%);
  font-family: Tahoma, sans-serif;
}

.scene {
  position: relative;
  width: 280px;
  height: 280px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.heart {
  position: absolute;
  width: 140px;
  height: 140px;
  background: #ff1744;
  transform: rotate(-45deg);
  animation: beat 1s infinite;
  filter: drop-shadow(0 0 22px #ff1744);
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: #ff1744;
}

.heart::before {
  top: -70px;
  left: 0;
}

.heart::after {
  top: 0;
  left: 70px;
}

.name {
  position: relative;
  z-index: 2;
  color: white;
  font-size: 29px;
  font-weight: bold;
  text-shadow: 0 0 10px white, 0 0 20px #ff8aa5;
  transform: translateY(8px);
  white-space: nowrap;
}

.floating {
  position: absolute;
  bottom: -40px;
  color: #ff477e;
  animation: rise 7s linear infinite;
  pointer-events: none;
}

@keyframes beat {
  0%, 100% { scale: 1; }
  50% { scale: 1.12; }
}

@keyframes rise {
  0% {
    transform: translateY(0) rotate(0);
    opacity: 0;
  }
  20% { opacity: 0.8; }
  100% {
    transform: translateY(-110vh) rotate(35deg);
    opacity: 0;
  }
}
</style>
</head>

<body>
  <div class="scene">
    <div class="heart"></div>
    <div class="name">جوجمی ❤️</div>
  </div>

  <script>
    for (let i = 0; i < 24; i++) {
      const heart = document.createElement("div");
      heart.className = "floating";
      heart.textContent = "♥";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (14 + Math.random() * 24) + "px";
      heart.style.animationDelay = Math.random() * 7 + "s";
      document.body.appendChild(heart);
    }
  </script>
</body>
</html>
